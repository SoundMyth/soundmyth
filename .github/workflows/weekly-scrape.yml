name: Weekly Scrape & Purge

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # step budgets: DJ 45 + others ~65; headroom as DJ list grows

    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Record start time
        # report.js uses this to count what THIS run wrote, via created_at.
        run: echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enrich Songkick URLs
        id: enrich_sk
        continue-on-error: true
        timeout-minutes: 15   # one-off: ~250 newly promoted DJs need a first lookup
                              # (~1 s each). Steady state is under a minute.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node enrich-songkick-urls.js

      - name: Scrape DJs (BIT + Songkick cascade)
        id: djs
        continue-on-error: true
        timeout-minutes: 30   # 852 DJs at concurrency=2 ≈ 9 min scraping + ~1 min of
                              # flushes; the rest is headroom for a slow Songkick.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BIT_APP_ID: ${{ secrets.BIT_APP_ID }}
        run: node scrape-extended.js

      - name: Scrape Festivals (BIT + Songkick)
        id: fest_bit
        continue-on-error: true
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BIT_APP_ID: ${{ secrets.BIT_APP_ID }}
        run: node scrape-festivals-bit.js

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Scrape Festivals (direct websites)
        id: fest_web
        continue-on-error: true
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scrape-festivals-direct.js

      - name: Scrape Festivals (Resident Advisor)
        id: fest_ra
        continue-on-error: true
        timeout-minutes: 10
        # Covers festivals with no Songkick URL — Songkick retired festival
        # search, so RA is their only structured source (and the only one that
        # returns a lineup).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scrape-festivals-ra.js

      - name: Enrich Clubs (RA URLs)
        id: clubs_enrich
        continue-on-error: true
        timeout-minutes: 10
        # Auto-fills ra_url for clubs that have none (no secrets: only calls ra.co).
        # The filled URLs are persisted by the "Commit updated data files" step.
        run: node enrich-clubs-ra.js

      - name: Scrape Clubs (Resident Advisor)
        id: clubs
        continue-on-error: true
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scrape-clubs-ra.js

      - name: Deduplicate events
        id: dedupe
        continue-on-error: true
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dedupe.js

      - name: Discover unlisted EDM DJs (RA-verified)
        id: discover
        continue-on-error: true
        timeout-minutes: 15
        # Reads events (anon) + verifies non-list DJs on Resident Advisor, writes
        # data/artists_candidates.json. Incremental: only NEW DJs hit RA (cache =
        # committed candidates file). cleanup-junk keeps events whose bill has a
        # listed DJ OR an onRA candidate.
        # SUPABASE_URL + SUPABASE_ANON_KEY passed explicitly so the script doesn't
        # need to parse index.html via regex (fragile if variable names change).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node discover-djs.js

      - name: Clean mislabelled junk events
        id: cleanup
        continue-on-error: true
        timeout-minutes: 12   # combined single-pass + parallel updates; headroom for the heavy first run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node cleanup-junk.js

      - name: Enrich event images (festivals + DJs)
        id: images
        continue-on-error: true
        timeout-minutes: 20
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node enrich-images.js

      - name: Validate & fix data quality
        id: validate
        continue-on-error: true
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node validate.js

      - name: Purge old events (>15 days)
        id: purge
        continue-on-error: true
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node purge.js

      - name: Commit updated data files
        id: commit
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/data/*.json
          git diff --staged --quiet || { git commit -m "data: weekly scrape update $(date +%Y-%m-%d)" && git pull --rebase && git push; }

      - name: Verify the run actually wrote data
        id: verify
        # Deliberately has NO continue-on-error. Every other step has one, so a run
        # where Supabase was unreachable for 90 minutes and wrote zero events still
        # reported "Success" — this step is what makes that run red.
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          total=$(curl -sS --max-time 30 -D - -o /dev/null \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Prefer: count=exact" -H "Range: 0-0" \
            "$SUPABASE_URL/rest/v1/events?select=id&date=gte.$(date +%F)" \
            | tr -d '\r' | sed -n 's/^[Cc]ontent-[Rr]ange: .*\///p')
          echo "Future events in DB: ${total:-<unreachable>}"
          if ! [ "$total" -ge 100 ] 2>/dev/null; then
            echo "::error::Supabase unreachable or events table nearly empty (${total:-none}). Check the project is not paused at https://supabase.com/dashboard"
            exit 1
          fi

      - name: Send run report
        # always(): the email matters most on the runs that broke, including when
        # the verify step above fails. Missing Brevo secrets only skip the send.
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          STEP_OUTCOMES: >-
            {
            "Enrich Songkick URLs": "${{ steps.enrich_sk.outcome }}",
            "Scrape DJs": "${{ steps.djs.outcome }}",
            "Festivals (BIT + Songkick)": "${{ steps.fest_bit.outcome }}",
            "Festivals (websites)": "${{ steps.fest_web.outcome }}",
            "Festivals (RA)": "${{ steps.fest_ra.outcome }}",
            "Enrich Clubs (RA URLs)": "${{ steps.clubs_enrich.outcome }}",
            "Clubs (RA)": "${{ steps.clubs.outcome }}",
            "Deduplicate": "${{ steps.dedupe.outcome }}",
            "Discover DJs": "${{ steps.discover.outcome }}",
            "Clean junk": "${{ steps.cleanup.outcome }}",
            "Enrich images": "${{ steps.images.outcome }}",
            "Validate": "${{ steps.validate.outcome }}",
            "Purge": "${{ steps.purge.outcome }}",
            "Commit data files": "${{ steps.commit.outcome }}",
            "Verify wrote data": "${{ steps.verify.outcome }}"
            }
        run: node report.js
